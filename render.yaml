# Blueprint de deploy no Render (https://render.com/docs/blueprint-spec).
#
# Como usar:
#   1. No dashboard do Render, clique em "New" -> "Blueprint".
#   2. Conecte o repositório GitHub deste projeto.
#   3. O Render lê este arquivo automaticamente e propõe criar o serviço
#      abaixo. Você vai ser solicitado a preencher GOOGLE_API_KEY na hora
#      (por causa do "sync: false" — o valor NUNCA fica neste arquivo).
#
# Leia deploy.md antes do primeiro deploy — em especial a seção sobre
# dimensionar o grafo, porque isso decide se o serviço cabe no plano.
#
# IMPORTANTE (confirmado em produção): em 2026, os planos "free" e
# "starter" do Render têm a MESMA RAM (512MB) — a diferença entre eles é
# só CPU e o serviço não dormir. Trocar de plano NÃO resolve falta de
# memória; só o plano "standard" (2GB, pago) resolveria isso pagando. Por
# isso este blueprint já vem configurado pra caber em 512MB de graça, via
# bbox (área menor) + grafo simplificado, em vez de assumir que dá pra
# pagar o problema.

services:
  - type: web
    name: comparador-rotas
    runtime: python
    plan: free
    # free e starter têm a mesma RAM (512MB) — não há motivo pra pagar
    # starter só por causa de memória. Pague starter se quiser o serviço
    # sempre ligado (sem dormir após 15min de inatividade), não por RAM.

    buildCommand: "pip install -r requirements.txt && python scripts/warm_cache.py"
    # Se cache/grafo_producao.graphml já existir no repositório (commitado —
    # ver deploy.md "Gere o grafo localmente"), warm_cache.py só CONFIRMA
    # que ele carrega certo, sem baixar nada. Sem esse arquivo commitado,
    # baixa via API do Overpass — que se mostrou pouco confiável rodando de
    # dentro do Render (timeouts recorrentes). Por isso o caminho
    # recomendado agora é gerar o grafo na sua máquina e commitar o
    # resultado, não depender do Overpass respondendo em produção.

    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300"
    # --workers 1: o grafo de ruas fica em memória por processo; múltiplos
    #   workers multiplicariam o uso de RAM (cada um guardaria sua própria
    #   cópia) — com 512MB de teto, isso quebraria o serviço na certa.
    # (sem --threads: o worker padrão do gunicorn é "sync", que processa uma
    #   requisição por vez — colocar --threads sem --worker-class gthread
    #   não tem efeito nenhum, e com a memória já apertada, processar uma
    #   requisição de cada vez é mais previsível do que arriscar picos de
    #   memória por concorrência real.)
    # --timeout 300: rotas com muitos clientes podem levar um tempo real
    #   pra resolver (matriz de distâncias + solver VRP); o padrão do
    #   gunicorn (30s) é curto demais para isso.

    healthCheckPath: /build
    # Endpoint leve (só devolve a versão do build em JSON) — não dispara
    # nenhum download nem cálculo pesado, ideal pro health check.

    envVars:
      - key: GOOGLE_API_KEY
        sync: false
        # Preenchido manualmente no dashboard do Render na criação do
        # Blueprint (ou depois, em Settings -> Environment). Precisa ter
        # Directions API E Routes API habilitadas no Google Cloud Console
        # para essa chave — ver README.md.

      - key: PYTHON_VERSION
        value: "3.12.3"

      # Nome FIXO do arquivo de cache (em vez do nome dinâmico baseado em
      # bbox/simplify) — precisa ser esse valor exato pra bater com o
      # arquivo que você vai gerar localmente e commitar (ver deploy.md).
      - key: GRAPH_CACHE_PATH
        value: "cache/grafo_producao.graphml"

      # Área BEM reduzida ao redor do depósito padrão da demo (Sé, São
      # Paulo). Só importa se cache/grafo_producao.graphml NÃO existir no
      # repositório ainda (senão o arquivo já commitado manda, e essas 4
      # variáveis são ignoradas). Ver deploy.md.
      # Recalibrado com dois pontos de dado reais: 9.6km² (1.6MB) coube em
      # 512MB; 196km² (31MB) estourou. A relação é praticamente linear
      # (~0.16MB/km²), então mirei num meio-termo BEM mais perto do que
      # funcionou: ~48km² (~8MB esperado), margem de 3,46km — cobre raio de
      # dispersão até uns 2,5km com folga. Ainda TESTE antes de confiar
      # (arquivo real pode não bater exatamente com a estimativa linear).
      - key: BBOX_NORTE
        value: "-23.5193"
      - key: BBOX_SUL
        value: "-23.5817"
      - key: BBOX_LESTE
        value: "-46.5993"
      - key: BBOX_OESTE
        value: "-46.6673"

      # Simplifica o grafo (bem menos nós = bem menos RAM). Reintroduz um
      # risco pequeno de retas em vias sem geometria salva no OSM, mas o
      # reparo automático via Google (ver README) cobre a maior parte dos
      # casos. Combinado com a bbox acima, é o que faz o serviço caber
      # confortavelmente em 512MB. Troque para "false" se migrar pro plano
      # "standard" (2GB) e quiser abrir mão dessa concessão.
      - key: GRAFO_SIMPLIFICAR
        value: "true"

      # Baixa/carrega o grafo QUANDO O PROCESSO SOBE, não na primeira
      # requisição de um usuário. Isso importa porque a API pública do
      # Overpass (usada pelo OSMnx pra baixar o mapa) pode ser lenta ou
      # entrar em fila — fácil de estourar o timeout de uma requisição HTTP
      # comum. Na fase de boot, o Render só libera tráfego pro serviço
      # depois do health check responder, então essa demora fica escondida
      # do usuário em vez de aparecer como erro na tela dele.
      - key: PRE_AQUECER_GRAFO
        value: "true"

    # Opcional: disco persistente, para o cache do grafo sobreviver a
    # reinícios SEM precisar rebaixar no build de cada novo deploy.
    # Requer plano pago com disco (não disponível no "free"). Sem isso, o
    # warm_cache.py no buildCommand já resolve o problema do timeout — o
    # disco só evita ter que rebaixar tudo de novo a cada novo deploy.
    # disk:
    #   name: grafo-cache
    #   mountPath: /opt/render/project/src/cache
    #   sizeGB: 1
